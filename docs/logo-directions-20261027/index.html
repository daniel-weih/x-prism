<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Prism · 三个新方向</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3f6;color:#24212d;font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}main{width:1120px;margin:auto;padding:46px 40px 38px}.eyebrow{color:#8c8698;font-size:11px;letter-spacing:.16em}h1{font-size:32px;letter-spacing:-.04em;margin:8px 0 10px}header p{margin:0;color:#827b8d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}article{background:#fff;border:1px solid #e7e3eb;border-radius:22px;overflow:hidden}.hero{height:238px;display:grid;place-items:center;background:#fbfafc}.hero img{width:132px;height:132px}.info{padding:24px 26px 18px;border-top:1px solid #f0edf3}h2{font-size:20px;margin:0 0 10px}h2 span{color:#a49caf;font-size:13px;margin-right:10px}p{margin:0;color:#827b8d;font-size:13px}.small{display:flex;align-items:center;gap:23px;margin-top:24px;padding:18px 0}.dark{display:flex;align-items:center;gap:23px;background:#25232c;border-radius:12px;padding:18px 16px}.swatch{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px;color:#99929f}.small img,.dark img{display:block}.wordmark{display:flex;align-items:center;gap:10px;margin:22px 0 2px;font-size:21px;font-weight:650;letter-spacing:-.04em}.wordmark img{width:30px;height:30px}footer{font-size:12px;color:#918999;margin-top:24px}
</style>
<main><header><div class="eyebrow">PRISM TRANSLATE / LOGO EXPLORATION</div><h1>让 Prism 有自己的形状。</h1><p>三个不同方向 · 大图、工具栏尺寸、深色背景一起看</p></header>
<section class="grid">
<article><div class="hero"><img src="a-prism-p.svg"></div><div class="info"><h2><span>A</span>折光 P</h2><p>白色笔画与紫色切面构成 P，<br>斜切留白呼应折射。</p><div class="small"><span class="swatch"><img src="a-prism-p.svg" width="16" height="16">16</span><span class="swatch"><img src="a-prism-p.svg" width="24" height="24">24</span><span class="swatch"><img src="a-prism-p.svg" width="32" height="32">32</span><span class="swatch"><img src="a-prism-p.svg" width="48" height="48">48 px</span></div><div class="dark"><img src="a-prism-p.svg" width="16" height="16"><img src="a-prism-p.svg" width="24" height="24"><img src="a-prism-p.svg" width="32" height="32"></div><div class="wordmark"><img src="a-prism-p.svg">Prism</div></div></article>
<article><div class="hero"><img src="b-fold.svg"></div><div class="info"><h2><span>B</span>双语折页</h2><p>珊瑚橙与折叠纸带，<br>两段笔画形成相互转换的路径。</p><div class="small"><span class="swatch"><img src="b-fold.svg" width="16" height="16">16</span><span class="swatch"><img src="b-fold.svg" width="24" height="24">24</span><span class="swatch"><img src="b-fold.svg" width="32" height="32">32</span><span class="swatch"><img src="b-fold.svg" width="48" height="48">48 px</span></div><div class="dark"><img src="b-fold.svg" width="16" height="16"><img src="b-fold.svg" width="24" height="24"><img src="b-fold.svg" width="32" height="32"></div><div class="wordmark"><img src="b-fold.svg">Prism</div></div></article>
<article><div class="hero"><img src="c-quotes.svg"></div><div class="info"><h2><span>C</span>对译</h2><p>两枚相向的引号，<br>用蓝紫与杏色表现两种语言。</p><div class="small"><span class="swatch"><img src="c-quotes.svg" width="16" height="16">16</span><span class="swatch"><img src="c-quotes.svg" width="24" height="24">24</span><span class="swatch"><img src="c-quotes.svg" width="32" height="32">32</span><span class="swatch"><img src="c-quotes.svg" width="48" height="48">48 px</span></div><div class="dark"><img src="c-quotes.svg" width="16" height="16"><img src="c-quotes.svg" width="24" height="24"><img src="c-quotes.svg" width="32" height="32"></div><div class="wordmark"><img src="c-quotes.svg">Prism</div></div></article>
</section><footer>矢量草案 · 2026-10-27 · 尚未替换正式图标</footer></main></html>
